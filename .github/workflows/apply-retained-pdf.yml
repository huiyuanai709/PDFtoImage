name: apply-retained-pdf
on:
  push:
    branches: [cursor/release-retained-pdf-08b9]
    paths:
      - .github/workflows/apply-retained-pdf.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cursor/release-retained-pdf-08b9
      - name: Apply retained-file patch
        run: |
          set -euo pipefail
          cat _b64/0.b64 _b64/1.b64 _b64/2.b64 _b64/3.b64 _b64/4.b64 | tr -d '\n' | base64 -d > /tmp/release-retained.patch
          git apply --check /tmp/release-retained.patch
          git apply /tmp/release-retained.patch
          git add -A
          git rm -rf _b64 .github/workflows/apply-retained-pdf.yml
          git -c user.name='huiyuanai709' -c user.email='huiyuanai709@gmail.com' commit -m 'Close retained PDF files when the caller releases them.'
          test "$(git rev-parse 'HEAD^{tree}')" = "2e40283f3d00c1a6d21ff63fc4d91af7c48fd277"
          git push origin HEAD:cursor/release-retained-pdf-08b9
